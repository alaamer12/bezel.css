<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snduk - Screen 4 (ترشيحات ذكية مخصّصة لك)</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: #020914; }
  </style>
</head>
<body>
  <div class="play-canvas theme-midnight-navy">
    <div class="bg-orb-1"></div>
    <div class="bg-orb-2"></div>

    <!-- Single Header Section -->
    <header class="screen-header single-header">
      <h1 class="header-title">
        ترشيحات ذكية<br>
        <span class="highlight">مخصّصة لك</span>
      </h1>
    </header>

    <!-- 3D Bottom Hero Stage -->
    <main class="stage-container stage-bottom-hero">
      <div class="device-mockup">
        <div class="btn-volume-up"></div>
        <div class="btn-volume-down"></div>
        <div class="btn-power"></div>

        <div class="device-screen-wrap">
          <!-- Status Bar -->
          <div class="mockup-status-bar">
            <span class="mockup-status-time">9:41</span>
            <div class="mockup-status-icons">
              <svg width="17" height="11" viewBox="0 0 17 11">
                <rect x="0" y="8" width="3" height="3" rx="0.5"/>
                <rect x="4.5" y="5.5" width="3" height="5.5" rx="0.5"/>
                <rect x="9" y="3" width="3" height="8" rx="0.5"/>
                <rect x="13.5" y="0" width="3" height="11" rx="0.5"/>
              </svg>
              <svg width="15" height="11" viewBox="0 0 15 11">
                <path d="M7.5 3C4.8 3 2.4 4.1 0.7 5.9L0 5.2C1.9 3.2 4.6 2 7.5 2C10.4 2 13.1 3.2 15 5.2L14.3 5.9C12.6 4.1 10.2 3 7.5 3Z"/>
                <path d="M7.5 6.5C5.7 6.5 4.1 7.2 2.9 8.4L2.2 7.7C3.6 6.3 5.5 5.5 7.5 5.5C9.5 5.5 11.4 6.3 12.8 7.7L12.1 8.4C10.9 7.2 9.3 6.5 7.5 6.5Z"/>
                <circle cx="7.5" cy="9.8" r="1.2"/>
              </svg>
              <svg width="22" height="11" viewBox="0 0 22 11">
                <rect x="0.5" y="0.5" width="18" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1"/>
                <rect x="2" y="2" width="13" height="7" rx="1.5" fill="currentColor"/>
                <path d="M20 3.5C20.6 3.5 21 3.9 21 4.5V6.5C21 7.1 20.6 7.5 20 7.5V3.5Z" fill="currentColor"/>
              </svg>
            </div>
          </div>
          <div class="dynamic-island">
            <div class="camera-lens"></div>
            <div class="sensor"></div>
          </div>
          <div class="screen-glare"></div>
          <img class="screen-image screen-crop-4" src="../input/4.jfif" alt="ترشيحات ذكية مخصّصة لك">
        </div>
      </div>
    </main>
  </div>
</body>
</html>
