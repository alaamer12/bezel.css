<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snduk iPad - Screen 3 (حاسبة ذكية لنمو استثماراتك)</title>
  <link rel="stylesheet" href="../demo/styles.css">
  <style>
    body { background: #030a08; }
  </style>
</head>
<body>
  <div class="ipad-canvas theme-emerald-growth">
    <div class="bg-orb-1"></div>
    <div class="bg-orb-2"></div>

    <!-- Header Section -->
    <header class="screen-header single-header">
      <h1 class="header-title">
        حاسبة ذكية<br>
        <span class="highlight">لنمو استثماراتك</span>
      </h1>
    </header>

    <!-- 13-inch iPad Pro Hero Stage -->
    <main class="ipad-stage-bottom-hero">
      <div class="ipad-mockup">
        <!-- Physical iPad Buttons -->
        <div class="ipad-btn-power"></div>
        <div class="ipad-btn-vol-up"></div>
        <div class="ipad-btn-vol-down"></div>

        <div class="ipad-screen-wrap">
          <!-- iPad Front Camera -->
          <div class="ipad-camera"></div>

          <div class="ipad-screen-glare"></div>
          <div class="ipad-screen-image-container">
            <img class="ipad-screen-image" src="../../input/3.jfif" alt="حاسبة ذكية لنمو استثماراتك">
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
