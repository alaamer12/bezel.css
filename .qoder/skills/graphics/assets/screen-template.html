<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Screen template skeleton</title>
  <link rel="stylesheet" href="../demo/styles.css">
  <style>
    /* Canvas sized to the exact store target (see references/frames.md). */
    html, body { width: 1320px; height: 2868px; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 96px;
      background: var(--bg, linear-gradient(160deg, #0f172a, #1e293b));
    }
    .headline {
      color: var(--text, #fff); font: 800 110px/1.3 var(--brand-font, sans-serif);
      /* line-height >= 1.3: Arabic diacritics clip at 1.15 */
      text-align: center; max-width: 1100px;
    }
    /* Device frame: replace with the project's frame classes or hand-rolled CSS. */
    .frame {
      width: 760px; aspect-ratio: 9 / 19.5; border-radius: 100px;
      background: #000; box-shadow: 0 0 0 14px #2a2a2e, 0 60px 120px rgb(0 0 0 / 50%);
      overflow: hidden; position: relative;
    }
    .frame img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; /* tune per screen with object-position */
    }
  </style>
</head>
<body>
  <h1 class="headline">Headline about this feature</h1>
  <div class="frame">
    <img src="../../../input/REPLACE_ME.png" alt="App screen" draggable="false">
  </div>
</body>
</html>
